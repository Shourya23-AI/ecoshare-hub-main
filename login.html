<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Log in — EcoShare Hub</title>
<link rel="stylesheet" href="css/style.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a href="index.html" class="brand"><span class="brand-mark">E</span> EcoShare Hub</a>
  </div>
</nav>

<div class="auth-wrap">
  <div class="auth-card">
    <h2 id="form-title">Welcome back</h2>
    <p class="sub" id="form-sub">Log in to claim and post items.</p>
    <div class="form-error" id="form-error"></div>

    <form id="login-form" method="POST" onsubmit="return false;">
      <div class="field" id="name-field" style="display:none;">
        <label>Username / Display Name</label>
        <input name="name" type="text" placeholder="JordanLee" />
      </div>
      <div class="field" id="building-field" style="display:none;">
        <label>Building / floor</label>
        <input name="building" type="text" placeholder="e.g. Block C, Floor 2" />
      </div>
      <div class="field">
        <label>Email</label>
        <input name="email" type="email" placeholder="you@example.com" required />
      </div>
      <div class="field">
        <label>Password</label>
        <input name="password" type="password" placeholder="••••••••" required minlength="6" />
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="submit-btn">Log in</button>
    </form>

    <p class="auth-switch" id="switch-text">
      New to EcoShare? <a href="#" id="switch-link">Create an account</a>
    </p>
    <p class="auth-switch"><a href="home.html" id="guest-link">Continue as guest (view demo)</a></p>
  </div>
</div>

<script type="module">
  import { signUp, logIn, enterGuestMode, syncAdminPrivileges } from "./js/auth.js";

  const params = new URLSearchParams(window.location.search);
  const nextPage = params.get("next") || "home.html";
  const guestLink = document.getElementById("guest-link");
  if (guestLink) {
    guestLink.addEventListener("click", enterGuestMode);
    guestLink.setAttribute("href", nextPage);
  }

  const errorBoxEl = document.getElementById("form-error");
  if (params.get("blocked") === "ip" && errorBoxEl) {
    errorBoxEl.textContent = "This device/network has been blocked by an admin. You've been signed out.";
    errorBoxEl.classList.add("show");
  }

  let mode = params.get("mode") === "signup" ? "signup" : "login";
  const form = document.getElementById("login-form");
  const errorBox = document.getElementById("form-error");
  const nameField = document.getElementById("name-field");
  const buildingField = document.getElementById("building-field");
  const title = document.getElementById("form-title");
  const sub = document.getElementById("form-sub");
  const submitBtn = document.getElementById("submit-btn");
  const switchText = document.getElementById("switch-text");

  function applyMode(isSignup) {
    if (nameField) nameField.style.display = isSignup ? "block" : "none";
    if (buildingField) buildingField.style.display = isSignup ? "block" : "none";
    if (title) title.textContent = isSignup ? "Create your account" : "Welcome back";
    if (sub) sub.textContent = isSignup ? "Join your community on EcoShare." : "Log in to claim and post items.";
    if (submitBtn) submitBtn.textContent = isSignup ? "Sign up" : "Log in";
    if (switchText) {
      switchText.innerHTML = isSignup
        ? `Already have an account? <a href="#" id="switch-link">Log in</a>`
        : `New to EcoShare? <a href="#" id="switch-link">Create an account</a>`;
      const switchLink = document.getElementById("switch-link");
      if (switchLink) switchLink.addEventListener("click", toggleMode);
    }
    if (errorBox) errorBox.classList.remove("show");
  }

  function toggleMode(e) {
    e.preventDefault();
    mode = mode === "login" ? "signup" : "login";
    applyMode(mode === "signup");
  }

  applyMode(mode === "signup");

  if (form) {
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      if (errorBox) errorBox.classList.remove("show");
      const data = new FormData(form);
      
      try {
        let user;
        if (mode === "signup") {
          user = await signUp({
            name: data.get("name"),
            email: data.get("email"),
            password: data.get("password"),
            building: data.get("building"),
          });
        } else {
          user = await logIn(data.get("email"), data.get("password"));
        }

        // Automatically sync admin role and route accordingly
        const isAdmin = await syncAdminPrivileges(user);
        
        if (isAdmin) {
          window.location.href = "admin.html";
        } else {
          window.location.href = nextPage;
        }

      } catch (err) {
        if (errorBox) {
          errorBox.textContent = err.message.replace("Firebase: ", "");
          errorBox.classList.add("show");
        }
      }
    });
  }
</script>
</body>
</html>
